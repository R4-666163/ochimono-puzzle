<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ビー玉トリオ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen arcade. Player well large on the left, NEXT + CPU well stacked on the right, two-thumb pad at the bottom.
   Look: ラムネ瓶 — pale aqua ground, bottle-glass green wells, glossy marbles stacked like a honeycomb. Deliberately single-theme. */
:root{
  --bg:#d3ebe6;
  --bg2:#bfe0da;
  --ink:#143538;
  --glass:#1b474c;
  --coral:#ff6f5e;
  --pad:#eef8f6;
  --pad-ink:#143538;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 20% 0%,#e6f6f2 0%,var(--bg) 55%,var(--bg2) 100%);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;letter-spacing:.02em;flex:1;white-space:nowrap}
h1 span{color:var(--coral)}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat b{font-family:var(--display);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat small{font-size:.62rem;letter-spacing:.08em;opacity:.7}
#pauseBtn{width:44px;height:44px;flex:none;touch-action:manipulation;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;font-size:.9rem;cursor:pointer}
#arena{flex:1;min-height:0;display:flex;gap:10px}
#pwrap{flex:1;min-width:0;display:flex;align-items:flex-start;justify-content:center}
#side{width:30%;max-width:150px;display:flex;flex-direction:column;gap:6px;min-height:0}
.lbl{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;opacity:.75}
#nwrap{background:var(--glass);border-radius:12px;padding:6px;display:flex;justify-content:center}
#cwrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
canvas{display:block;touch-action:none}
#pad{display:grid;grid-template-columns:1fr 1fr 14px 1fr 1fr;grid-template-rows:60px 60px;gap:8px;padding-bottom:6px}
#bL{grid-column:1;grid-row:1/3;font-size:2rem}
#bR{grid-column:2;grid-row:1/3;font-size:2rem}
#bRot{grid-column:4/6;grid-row:1;font-size:1.8rem}
#bD{grid-column:4;grid-row:2}
#bH{grid-column:5;grid-row:2}
.btn{height:100%;min-height:56px;border-radius:18px;border:none;background:var(--pad);color:var(--pad-ink);font-size:1.5rem;font-weight:800;box-shadow:0 4px 0 #9cc7bf,inset 0 1px 0 #fff;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer;font-family:var(--body);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;transition:transform 60ms,background 60ms}
.btn small{font-size:.56rem;margin-top:3px;opacity:.7;letter-spacing:.04em}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 #9cc7bf;background:#d4eeea}
.btn.rot{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c94a3c}
.btn.rot.on{box-shadow:0 1px 0 #c94a3c;background:#e85a4a}
.btn:focus-visible,#pauseBtn:focus-visible,.choice:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,53,56,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;overflow-y:auto}
.card{background:#f4fbf9;color:var(--ink);border-radius:22px;padding:20px 18px;max-width:370px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:11px;margin-block:16px}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.6rem;text-wrap:balance}

.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--glass);border-radius:14px;padding:8px 4px}
.shapes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.shapes figcaption{color:#fff;font-size:.6rem;font-weight:800;text-align:center;line-height:1.3}
.online{display:flex;flex-direction:column;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.code{font-family:var(--display);font-size:2.6rem;letter-spacing:.12em;text-align:center;color:var(--coral)}
.codein{font-family:var(--display);font-size:1.8rem;letter-spacing:.3em;text-align:center;padding:10px;border:2px solid var(--ink);border-radius:14px;width:100%;box-sizing:border-box;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.err{color:#c0392b;font-weight:800;font-size:.8rem;min-height:1.1em;margin:0}
.card h2.go{font-size:2.2rem;text-align:center;padding:18px 0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;padding:12px 4px;font-family:var(--body);font-weight:800;font-size:.95rem;cursor:pointer}
.choice.main{background:var(--ink);color:#fff}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div id="app">
  <header>
    <h1>ビー玉<span>トリオ</span></h1>
    <div class="stat"><small>スコア</small><b id="score">0</b></div>
    <div class="stat"><small>最大れんさ</small><b id="maxc">0</b></div>
    <button id="pauseBtn" aria-label="一時停止">II</button>
  </header>
  <main id="arena">
    <div id="pwrap"><canvas id="pc" aria-label="あなたのフィールド"></canvas></div>
    <aside id="side">
      <div class="lbl">NEXT</div>
      <div id="nwrap"><canvas id="nc"></canvas></div>
      <div class="lbl" id="sideLbl">CPU</div>
      <div id="cwrap"><canvas id="cc" aria-label="CPUのフィールド"></canvas></div>
    </aside>
  </main>
  <div id="pad">
    <button class="btn" id="bL" aria-label="左へ">◀</button>
    <button class="btn" id="bR" aria-label="右へ">▶</button>
    <button class="btn rot" id="bRot" aria-label="回転">⟳<small>回転</small></button>
    <button class="btn" id="bD" aria-label="はやく落とす">▼<small>はやく</small></button>
    <button class="btn" id="bH" aria-label="一気に落とす">⤓<small>落とす</small></button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(()=>{
// Honeycomb well in "doubled" coordinates: a ball at row y sits at column dc, where dc and y share parity.
const W=8,H=14,R=0.866,NCOL=5,CLEAR=6,JUNK=9,JUNK_FALL=0.018;
const COLORS={1:['#ffb3a8','#ff6f5e','#b8382b'],2:['#fff1b0','#ffc93c','#c78a00'],3:['#bfe6ff','#4fb3ff','#1a62b3'],4:['#c4f5d6','#4fd189','#1a8a4c'],5:['#e6dbff','#a98bff','#6343c4']};
const DIFF={easy:{name:'かんたん',delay:520,noise:70},normal:{name:'ふつう',delay:300,noise:18},hard:{name:'つよい',delay:140,noise:0}};
const NB=[[-2,0],[2,0],[-1,-1],[1,-1],[-1,1],[1,1]];
const SPAWN={o:0,dc:8,y:0};
const rnd=n=>Math.floor(Math.random()*n);
const valid=(dc,y)=>y>=0&&y<H&&dc>=0&&dc<=2*W-2+(y&1)&&((dc&1)===(y&1));
const mkG=()=>Array.from({length:H},()=>Array(2*W).fill(null));
let PID=1;

function randPiece(){return {...SPAWN,c:[1+rnd(NCOL),1+rnd(NCOL),1+rnd(NCOL)]}}
// o=0: point-up triangle [apex, lower-right, lower-left]; o=1: point-down [top-left, top-right, bottom]
function pcells(p){
  return p.o===0
    ?[[p.dc,p.y,p.c[0]],[p.dc+1,p.y+1,p.c[1]],[p.dc-1,p.y+1,p.c[2]]]
    :[[p.dc,p.y,p.c[0]],[p.dc+2,p.y,p.c[1]],[p.dc+1,p.y+1,p.c[2]]];
}
function rot(p){ // 60° clockwise
  return p.o===0?{o:1,c:[p.c[2],p.c[0],p.c[1]],dc:p.dc-1,y:p.y+1}:{o:0,c:[p.c[0],p.c[1],p.c[2]],dc:p.dc+1,y:p.y-1};
}
function fits(g,p){return pcells(p).every(([dc,y])=>valid(dc,y)&&!g[y][dc])}
function place(g,p,pid,from){const fc=from?pcells(from):null;pcells(p).forEach(([dc,y,c],i)=>{g[y][dc]={c,pid,fresh:true,vx:fc?fc[i][0]:dc,vy:fc?fc[i][1]:y}})}
// let the whole trio slide down into the honeycomb as one rigid piece
function settle(g,p){
  for(;;){
    if(fits(g,{...p,y:p.y+2})){p={...p,y:p.y+2};continue}
    const a={...p,dc:p.dc-1,y:p.y+1},b={...p,dc:p.dc+1,y:p.y+1},fa=fits(g,a),fb=fits(g,b);
    if(fa&&fb)p=p.dc<W?b:a;else if(fa)p=a;else if(fb)p=b;else return p;
  }
}
// a trio whose balls rolled apart is no longer one trio
function splitPids(g){
  const seen=new Set(),used=new Set();
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=g[y][dc];if(!b||b.junk||seen.has(b))continue;
    const comp=[b],st=[[dc,y]];seen.add(b);
    while(st.length){const [x,yy]=st.pop();for(const [ax,ay] of NB){const nx=x+ax,ny=yy+ay;if(!valid(nx,ny))continue;const o=g[ny][nx];
      if(o&&!seen.has(o)&&o.pid===b.pid&&!o.junk){seen.add(o);comp.push(o);st.push([nx,ny])}}}
    if(used.has(b.pid)){const np=PID++;comp.forEach(o=>o.pid=np)}else used.add(b.pid);
  }
}
const solid=(g,dc,y)=>!valid(dc,y)||!!g[y][dc];
// balls without support on both lower sides roll or drop
function physics(g,mark){
  let moved=true;
  while(moved){moved=false;
    for(let y=H-2;y>=0;y--)for(let dc=0;dc<2*W;dc++){
      const b=g[y][dc];if(!b)continue;
      const sL=solid(g,dc-1,y+1),sR=solid(g,dc+1,y+1);
      if(sL&&sR)continue;
      let t;
      if(!sL&&!sR){t=(valid(dc,y+2)&&!g[y+2][dc])?[dc,y+2]:(dc<W?[dc+1,y+1]:[dc-1,y+1])}
      else t=sL?[dc+1,y+1]:[dc-1,y+1];
      g[t[1]][t[0]]=b;g[y][dc]=null;moved=true;if(mark)b.fresh=true;
    }
  }
  splitPids(g);
}
// only these exact 6-ball shapes (技) send junk; atk = balls sent, as in 6ボールパズル
const LINE=d=>Array.from({length:6},(_,i)=>[d[0]*i,d[1]*i]);
const SHAPES=[
  {name:'ピラミッド',atk:24,cells:[[0,0],[-1,1],[1,1],[-2,2],[0,2],[2,2]]},
  {name:'ピラミッド',atk:24,cells:[[-2,0],[0,0],[2,0],[-1,1],[1,1],[0,2]]},
  {name:'ストレート',atk:19,cells:LINE([2,0])},
  {name:'ストレート',atk:19,cells:LINE([1,1])},
  {name:'ストレート',atk:19,cells:LINE([-1,1])},
  {name:'ヘキサゴン',atk:36,center:true,cells:NB.map(([x,y])=>[x,y])},
].map(s=>({...s,cells:s.cells.sort((a,b)=>a[1]-b[1]||a[0]-b[0])}));
// a same-color group counts as a 技 if the shape sits anywhere inside it, extra balls or not;
// a group holding several shapes counts once, as the strongest
function shapeOf(g,grp,c){
  if(grp.length<6)return null;
  const set=new Set(grp.map(([x,y])=>y*64+x));let best=null;
  for(const [gx,gy] of grp)for(const sh of SHAPES){
    if(best&&sh.atk<=best.atk)continue;
    const ox=gx-sh.cells[0][0],oy=gy-sh.cells[0][1];
    if(!sh.cells.every(([x,y])=>set.has((y+oy)*64+x+ox)))continue;
    if(sh.center){const m=valid(ox,oy)&&g[oy][ox];if(!m||m.c===c)continue}
    best=sh;
  }
  return best;
}
function findClear(g){
  const seen=new Set(),hit=new Set(),shapes=[],techColors=new Set();let groups=0;
  const key=(dc,y)=>y*64+dc;
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){
    const b=g[y][dc];if(!b||seen.has(key(dc,y)))continue;
    const st=[[dc,y]],grp=[];seen.add(key(dc,y));
    while(st.length){const [x,yy]=st.pop();grp.push([x,yy]);
      for(const [ax,ay] of NB){const nx=x+ax,ny=yy+ay;
        if(valid(nx,ny)&&g[ny][nx]&&g[ny][nx].c===b.c&&!seen.has(key(nx,ny))){seen.add(key(nx,ny));st.push([nx,ny])}}}
    // a 技 always goes; a plain group only once a ball you just placed (or one that fell from your
    // move) is in it -- junk landing next to its colour alone is not enough
    if(grp.length>=CLEAR){const sh=shapeOf(g,grp,b.c);
      if(sh||grp.some(([x,yy])=>g[yy][x].fresh)){groups++;grp.forEach(([x,yy])=>hit.add(key(x,yy)));if(sh){shapes.push(sh);techColors.add(b.c)}}}
  }
  if(!groups)return null;
  // a 技 wipes every ball of its color off the field
  if(techColors.size)for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=g[y][dc];if(b&&techColors.has(b.c))hit.add(key(dc,y))}
  // junk next to anything removed breaks too
  for(const k of [...hit]){const y=Math.floor(k/64),dc=k%64;
    for(const [ax,ay] of NB){const nx=dc+ax,ny=y+ay;if(valid(nx,ny)&&g[ny][nx]&&g[ny][nx].junk)hit.add(key(nx,ny))}}
  const list=[...hit].map(k=>[k%64,Math.floor(k/64)]);
  return {list,removed:list.length,groups,shapes};
}

// junk arrives as a chain of the same 技 shape and falls as one block.
// ピラミッド/ヘキサゴン: copies of the shape packed together; inside each copy no two touching balls share a colour
function formation(sh,n){
  const cells=[],used=new Set(),k=(x,y)=>y*64+x,[ax,ay]=sh.cells[0];let u=0;
  for(let y=0;cells.length<n;y++)for(let dc=0;dc<2*W&&cells.length<n;dc++){
    const pts=sh.cells.map(([x,yy])=>[x-ax+dc,yy-ay+y]);
    if(!pts.every(([x,yy])=>x>=0&&x<=2*W-2+(yy&1)&&(x&1)===(yy&1)&&!used.has(k(x,yy))))continue;
    for(const p of pts.slice(0,n-cells.length)){used.add(k(p[0],p[1]));cells.push([p[0],p[1],0,u])}
    u++;
  }
  for(const b of cells){
    const taken=new Set(cells.filter(o=>o[3]===b[3]&&o[2]&&NB.some(([dx,dy])=>o[0]===b[0]+dx&&o[1]===b[1]+dy)).map(o=>o[2]));
    const free=[1,2,3,4,5].filter(c=>!taken.has(c));b[2]=free[rnd(free.length)];
  }
  return cells;
}
// ストレート (any direction): as in 6ボールパズル, a full row with a half-shifted row on top, colours
// cycling 黄 紫 赤 青 緑 so each upper ball pairs with the one below-left; the rest of 19 sits on a third row
const STRAIGHT_ORDER=[2,5,1,3,4];
function straightBlock(n){
  const out=[];
  for(let i=0;i<W&&out.length<n;i++)out.push([2*i+1,3,STRAIGHT_ORDER[i%5]]);
  for(let i=0;i<W-1&&out.length<n;i++)out.push([2*i+2,2,STRAIGHT_ORDER[i%5]]);
  for(const d of [5,7,9,11,3,13,1,15])if(out.length<n)out.push([d,1,STRAIGHT_ORDER[((d-1)/2+2)%5]]);
  return out;
}
function dropFormation(g,sh,n){
  let cells=sh.name==='ストレート'?straightBlock(n):formation(sh,n);const top=-(Math.max(...cells.map(c=>c[1]))+2)&~1;
  // slide the whole chain sideways to a random spot that still fits the well
  const room=2*W-2-Math.max(...cells.map(c=>c[0]-(c[1]&1))),sx=2*rnd(Math.floor(room/2)+1);
  cells=cells.map(([x,y,c])=>[x+sx,y,c]);
  const ok=o=>cells.every(([x,y])=>y+o<0||(y+o<H&&!g[y+o][x]));
  let oy=top;while(ok(oy+2))oy+=2;
  cells.forEach(([x,y,c])=>{if(y+oy>=0)g[y+oy][x]={c,junk:true,pid:PID++,vx:x,vy:y+top,ly:y+oy}});
}

class Field{
  constructor(cpu){this.cpu=cpu;this.reset()}
  reset(){Object.assign(this,{g:mkG(),piece:null,next:randPiece(),state:'spawn',t:0,score:0,chain:0,maxChain:0,pending:0,queue:[],sent:[],fallT:0,lockT:0,flash:null,popups:[],soft:false,plan:null,cpuT:0,gDone:false})}
  spawn(){
    if(this.pending>0&&!this.gDone){this.dropJunk();this.gDone=true;this.state='gwait';return}
    this.gDone=false;
    this.piece=this.next;this.next=randPiece();
    if(!fits(this.g,this.piece)){this.state='dead';game.onDead(this);return}
    this.state='play';this.fallT=0;this.lockT=0;
    if(this.cpu)this.makePlan();
  }
  dropJunk(){
    for(const a of this.queue)dropFormation(this.g,a.sh,a.n);
    this.queue=[];this.pending=0;physics(this.g);
  }
  animate(dt){
    const step=dt*0.012;let still=true;
    for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=this.g[y][dc];if(!b)continue;
      // incoming junk: the whole block drops straight down at one steady speed, then settles
      if(b.ly!=null){if(b.vy<b.ly){b.vy=Math.min(b.ly,b.vy+dt*JUNK_FALL);still=false;continue}b.ly=null}
      const dx=(dc-b.vx)/2,dy=(y-b.vy)*R,d=Math.hypot(dx,dy);
      if(d<1e-3){b.vx=dc;b.vy=y;continue}
      still=false;const s=Math.min(1,step/d);b.vx+=(dc-b.vx)*s;b.vy+=(y-b.vy)*s}
    return still;
  }
  move(dx){if(this.state!=='play')return false;const p={...this.piece,dc:this.piece.dc+2*dx};if(fits(this.g,p)){this.piece=p;this.lockT=0;return true}return false}
  rotate(){if(this.state!=='play')return;const r=rot(this.piece);
    for(const [kx,ky] of [[0,0],[-2,0],[2,0],[0,2],[0,-2]]){const p={...r,dc:r.dc+kx,y:r.y+ky};if(fits(this.g,p)){this.piece=p;this.lockT=0;return}}}
  dropPos(){return settle(this.g,this.piece)}
  hardDrop(){if(this.state!=='play')return;const p=this.dropPos();this.score+=(p.y-this.piece.y);this.lock()}
  lock(){const from=this.piece,p=settle(this.g,from);place(this.g,p,PID++,from);this.piece=null;physics(this.g,true);this.chain=0;this.sent=[];this.state='settle'}
  update(dt){
    const still=this.animate(dt);
    this.popups=this.popups.filter(p=>(p.t+=dt)<1100);
    switch(this.state){
      case 'spawn':this.spawn();break;
      // junk has landed: a 技 it completed fires now (and can chain); plain groups wait for your ball
      case 'gwait':if(still){this.chain=0;this.sent=[];this.state='settle'}break;
      case 'play':{
        if(this.cpu)this.cpuStep(dt);
        if(this.state!=='play')break;
        const down={...this.piece,y:this.piece.y+2};
        if(!fits(this.g,down)){this.lockT+=dt;if(this.lockT>450)this.lock()}
        else{this.lockT=0;this.fallT+=dt;const iv=this.soft?45:game.speed;if(this.fallT>=iv){this.fallT=Math.min(this.fallT-iv,iv);this.piece=down;if(this.soft)this.score+=1}}
        break}
      case 'settle':
        if(still){const r=findClear(this.g);
          if(r){this.chain++;this.maxChain=Math.max(this.maxChain,this.chain);this.flash=r.list;this.t=0;this.state='flash';
            this.score+=r.removed*10*this.chain+(r.groups-1)*50;
            for(const sh of r.shapes)this.sent.push({sh,n:sh.atk});
            this.popups.push({txt:this.chain>=2?this.chain+'れんさ!':r.removed+'こ消し',t:0,small:this.chain<2});
            if(r.shapes.length)this.popups.push({txt:[...new Set(r.shapes.map(s=>s.name))].join('・')+'!',t:0,small:true,hi:true});
          }else this.endResolve()}
        break;
      case 'flash':this.t+=dt;if(this.t>380){for(const [dc,y] of this.flash)this.g[y][dc]=null;this.flash=null;physics(this.g,true);this.state='settle'}break;
    }
  }
  // no offsetting: everything made this turn goes straight to the other side
  endResolve(){
    const o=game.other(this),a=this.sent.reduce((t,x)=>t+x.n,0);
    if(a>0){if(game.mode==='online')net.attack(this.sent);else{o.queue.push(...this.sent);o.pending+=a}this.popups.push({txt:'じゃま玉 '+a+' →',t:0,small:true,low:true})}
    for(const row of this.g)for(const b of row)if(b)b.fresh=false;
    this.sent=[];this.chain=0;this.state='spawn';
  }
  // ---- CPU ----
  makePlan(){
    const d=DIFF[game.diff];let best=null;let s=this.piece;
    for(let r=0;r<6;r++){
      for(let k=-8;k<=8;k++){
        let p={...s,dc:s.dc+2*k};if(!fits(this.g,p))continue;
        p=settle(this.g,p);
        const v=evaluate(this.g,p)+Math.random()*d.noise;
        if(!best||v>best.v)best={v,r,dc:s.dc+2*k};
      }
      s=rot(s);
    }
    this.plan=best||{r:0,dc:this.piece.dc};this.cpuT=0;
  }
  cpuStep(dt){
    this.cpuT+=dt;if(this.cpuT<DIFF[game.diff].delay)return;this.cpuT=0;
    const pl=this.plan;
    if(pl.r>0){this.rotate();pl.r--;return}
    if(this.piece.dc<pl.dc-1){if(!this.move(1))this.hardDrop();return}
    if(this.piece.dc>pl.dc+1){if(!this.move(-1))this.hardDrop();return}
    this.hardDrop();
  }
}
function evaluate(g0,p){
  const g=g0.map(r=>r.map(b=>b?{c:b.c,pid:b.pid,junk:b.junk}:null));
  place(g,p,-1);physics(g,true);
  let chain=0,removed=0,r;
  let atk=0;
  while((r=findClear(g))){chain++;removed+=r.removed;for(const sh of r.shapes)atk+=sh.atk;for(const [dc,y] of r.list)g[y][dc]=null;physics(g,true)}
  let v=removed*8+chain*chain*45+atk*12,adj=0,top=H;
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=g[y][dc];if(!b)continue;top=Math.min(top,y);
    for(const [ax,ay] of [[2,0],[1,1],[-1,1]]){const nx=dc+ax,ny=y+ay;if(valid(nx,ny)&&g[ny][nx]&&g[ny][nx].c===b.c)adj++}}
  v+=adj*5-(H-top)*3;
  for(let y=0;y<4;y++)for(let dc=5;dc<=11;dc++)if(valid(dc,y)&&g[y][dc])v-=300;
  return v;
}

// ---- Game ----
const cpuField=new Field(true);
const game={diff:'normal',mode:'cpu',speed:900,elapsed:0,running:false,paused:false,
  p:new Field(false),c:cpuField,
  other(f){return f===this.p?this.c:this.p},
  start(diff){net.leave();this.mode='cpu';this.c=cpuField;setSideLabel();this.diff=diff;this.p.reset();this.c.reset();this.elapsed=0;this.running=true;this.paused=false;hideOverlay()},
  startOnline(){this.mode='online';this.c=net.view;setSideLabel();this.p.reset();this.elapsed=0;this.running=true;this.paused=false;hideOverlay()},
  onDead(f){this.running=false;if(this.mode==='online'){net.phase='end';net.send();setTimeout(()=>showEnd(false),600)}else setTimeout(()=>showEnd(f===this.c),600)}
};

// The same calls as claude.ai's named room (join/presence/peers/onPeers/leave), over a WebSocket
// to this site's /ws/<name> relay (src/index.js), so anyone with the page can play online.
function wsRoom(){
  return {join:name=>new Promise((resolve,reject)=>{
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+name);
    let me=null,list=[],handlers=[];
    const peers=()=>list.map(p=>({peer:p.peer,presence:p.presence||{},sameTab:p.peer===me,isMe:p.peer===me,kind:'viewer',guest:false,by:null}));
    const fire=()=>{const ps=peers();for(const h of handlers)h({peers:ps})};
    const timer=setTimeout(()=>{try{ws.close()}catch(_){}reject(new Error('timeout'))},8000);
    const api={name,peers,connected:()=>ws.readyState===1,
      onPeers(h){handlers.push(h);setTimeout(()=>h({peers:peers()}),0);return()=>{handlers=handlers.filter(x=>x!==h)}},
      async presence(patch){if(ws.readyState===1)ws.send(JSON.stringify({t:'p',patch}))},
      async leave(){handlers=[];try{ws.close()}catch(_){}}};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}
      if(d.t==='hello'){me=d.peer;clearTimeout(timer);resolve(api)}
      else if(d.t==='peers'&&Array.isArray(d.peers)){list=d.peers.filter(p=>p&&typeof p.peer==='string');fire()}};
    ws.onerror=()=>{if(!me){clearTimeout(timer);reject(new Error('ws'))}};
    ws.onclose=()=>{list=list.filter(p=>p.peer===me);fire()}; // cut off: everyone else is gone as far as we can tell
  })};
}

// ---- Online: a 6-digit code names a room; each side runs its own well and shares it through room presence ----
const BCH='0123456789abcde'; // 0 empty, 1-5 ball, a-e junk ball of that color
const net={room:null,r:null,role:null,code:'',phase:'idle',opp:null,me:null,ready:false,seq:0,log:[],seen:0,timer:null,unsub:null,lastB:'',
  view:{g:mkG(),piece:null,state:'play',pending:0,popups:[],flash:null,t:0,fallT:0,soft:false},
  // claude.ai's room when opened there; otherwise our own relay on the site that served this page
  async getRoom(){
    if(!this.room&&window.claude&&typeof claude.use==='function')this.room=await claude.use('room').catch(()=>null);
    if(!this.room&&/^https?:$/.test(location.protocol)&&!window.claude)this.room=wsRoom();
    return this.room},
  others(){return this.r?this.r.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.app==='bdt'):[]},
  async open(code,role){
    const room=await this.getRoom();if(!room)throw new Error('noroom');
    this.leave();
    this.r=await room.join('bdt-'+code);
    Object.assign(this,{code,role,phase:'lobby',opp:null,ready:false,seq:0,log:[],seen:0,lastB:'',round:1,wantAgain:false});
    this.unsub=this.r.onPeers(()=>this.tick());
    await this.r.presence({app:'bdt',role,st:'wait'});
  },
  leave(){clearInterval(this.timer);this.timer=null;if(this.unsub)this.unsub();this.unsub=null;
    if(this.r)this.r.leave().catch(()=>{});this.r=null;this.phase='idle';this.opp=null},
  tick(){
    if(!this.r)return;
    const others=this.others();this.me=(this.r.peers().find(p=>p.sameTab)||{}).peer;
    if(this.phase==='lobby'){
      if(this.role==='host'){
        const g=others.find(p=>p.presence.role==='guest'&&p.presence.st==='ready');
        if(g){this.opp=g.peer;this.r.presence({st:'go',vs:g.peer});this.begin()}
      }else{
        const h=others.find(p=>p.presence.role==='host');if(!h)return;
        const vs=h.presence.vs;
        if(vs&&vs!==this.me){this.leave();showJoin('この部屋はもう対戦中です')}
        else if(vs===this.me&&h.presence.st!=='wait'){this.opp=h.peer;this.begin()}
        else if(h.presence.st==='wait'&&!this.ready){this.ready=true;this.r.presence({st:'ready'})}
      }
      return;
    }
    const o=others.find(p=>p.peer===this.opp);
    if(this.phase==='end'){
      // after a match: both pick もう一回 -> next round; the other leaving (やめる) sends everyone home
      if(!o){goHome('');return}
      const s=o.presence,theirs=s.rm===this.round;
      if(this.wantAgain&&theirs){this.round++;this.begin();return}
      const note=document.getElementById('rmNote');if(note)note.textContent=theirs?'相手は「もう一回」を選んでいます':'';
      return;
    }
    if(this.phase!=='play')return;
    if(!o){goHome(game.running?'相手が部屋を出たので、あなたの勝ちです':'相手が部屋を出ました');return}
    this.apply(o.presence);
  },
  again(){this.wantAgain=true;this.r.presence({rm:this.round}).catch(()=>{});this.tick()},
  begin(){
    this.phase='play';this.wantAgain=false;this.seq=0;this.log=[];this.seen=0;
    this.view.g=mkG();this.view.piece=null;this.view.state='play';this.view.pending=0;this.lastB='';
    game.running=false;game.p.reset(); // never let a finished match's board (or its "dead" flag) reach the new opponent
    card.innerHTML=`<h2 class="go"><span>ゲームスタート!</span></h2>`;overlay.hidden=false;
    setTimeout(()=>{if(this.phase==='play')game.startOnline()},1200);
    clearInterval(this.timer);this.timer=setInterval(()=>this.send(),100);
  },
  // what the other side sees: my board, falling trio, incoming junk count, and the 技 I've sent
  send(){
    if(!this.r)return;const p=game.p;let b='';
    for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++)if(valid(dc,y)){const x=p.g[y][dc];b+=x?BCH[x.c+(x.junk?9:0)]:'0'}
    const pc=p.piece&&p.state==='play'?[p.piece.o,p.piece.dc,p.piece.y,...p.piece.c]:null;
    this.r.presence({st:this.phase,r:this.round,b,pc,pd:p.pending,dead:p.state==='dead',atk:{s:this.seq,l:this.log}}).catch(()=>{});
  },
  attack(sent){for(const {sh} of sent){this.log.push([++this.seq,SHAPES.indexOf(sh)]);if(this.log.length>12)this.log.shift()}this.send()},
  // the opponent's presence is untrusted: read only what parses, never trust counts it claims
  apply(s){
    if(s.r!==this.round)return; // still showing the previous round: wait for their fresh state
    const v=this.view;
    if(typeof s.b==='string'&&s.b!==this.lastB){this.lastB=s.b;const g=mkG();let i=0;
      for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++)if(valid(dc,y)){const k=BCH.indexOf(s.b[i++]);
        if(k>0)g[y][dc]={c:k>9?k-9:k,junk:k>9,pid:PID++,vx:dc,vy:y}}
      v.g=g}
    const pc=s.pc;v.piece=Array.isArray(pc)&&pc.length===6&&pc.every(Number.isInteger)&&pc.slice(3).every(c=>c>=1&&c<=NCOL)?{o:pc[0]?1:0,dc:pc[1],y:pc[2],c:pc.slice(3)}:null;
    if(v.piece&&!pcells(v.piece).every(([dc,y])=>valid(dc,y)))v.piece=null;
    v.pending=Number.isInteger(s.pd)?Math.max(0,Math.min(999,s.pd)):0;
    if(s.atk&&Array.isArray(s.atk.l))for(const e of s.atk.l){
      if(!Array.isArray(e)||!Number.isInteger(e[0])||e[0]<=this.seen||!SHAPES[e[1]])continue;
      this.seen=e[0];const sh=SHAPES[e[1]];game.p.queue.push({sh,n:sh.atk});game.p.pending+=sh.atk}
    if(s.dead===true){v.state='dead';if(game.running){game.running=false;this.phase='end';this.send();setTimeout(()=>showEnd(true),600)}}
  }
};

const pc=document.getElementById('pc'),cc=document.getElementById('cc'),nc=document.getElementById('nc');
const dpr=Math.min(window.devicePixelRatio||1,3);
const FW=W+0.5,FH=(H-1)*R+1;
const sizes={p:30,c:14,n:20};
function fit(cv,wrap,cols,rows,key,maxCell){
  const w=wrap.clientWidth,h=wrap.clientHeight||w*rows/cols;
  const cell=Math.max(6,Math.min(w/cols,h/rows,maxCell||999));
  sizes[key]=cell;const cw=Math.floor(cell*cols),ch=Math.floor(cell*rows);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
}

}
new ResizeObserver(layout).observe(document.getElementById('arena'));

const GLYPH={1:'dot',2:'tri',3:'sq',4:'dia',5:'plus'};
function ball(ctx,cx,cy,r,c,alpha,junk){
  ctx.save();ctx.globalAlpha=alpha??1;
  if(c===JUNK){
    const g=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#c9d6d8');g.addColorStop(1,'#7e9296');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(70,95,100,.45)';for(const [a,b] of [[-.3,.2],[.25,-.1],[.1,.35],[-.05,-.35]]){ctx.beginPath();ctx.arc(cx+a*r,cy+b*r,r*.09,0,7);ctx.fill()}
  }else{
    const [l,m,d]=COLORS[c];
    const g=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r*1.05);g.addColorStop(0,l);g.addColorStop(.45,m);g.addColorStop(1,d);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    if(r>7){ctx.fillStyle='rgba(255,255,255,.55)';const k=r*.24,oy=cy+r*.12;ctx.beginPath();
      const t=GLYPH[c];
      if(t==='dot')ctx.arc(cx,oy,k*.8,0,7);
      else if(t==='tri'){ctx.moveTo(cx,oy-k);ctx.lineTo(cx+k,oy+k*.8);ctx.lineTo(cx-k,oy+k*.8)}
      else if(t==='sq')ctx.rect(cx-k*.75,oy-k*.75,k*1.5,k*1.5);
      else if(t==='dia'){ctx.moveTo(cx,oy-k);ctx.lineTo(cx+k,oy);ctx.lineTo(cx,oy+k);ctx.lineTo(cx-k,oy)}
      else{ctx.rect(cx-k,oy-k*.3,k*2,k*.6);ctx.rect(cx-k*.3,oy-k,k*.6,k*2)}
      ctx.fill()}
    // junk keeps its full color; only a thin white rim tells it apart
    if(junk){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(1,r*.1);ctx.beginPath();ctx.arc(cx,cy,r*.92,0,7);ctx.stroke()}
  }
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(cx-r*.38,cy-r*.42,r*.26,r*.15,-.6,0,7);ctx.fill();
  ctx.restore();
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
const PX=(dc,cell)=>(dc/2+.5)*cell, PY=(y,cell)=>(y*R+.5)*cell;
function link(ctx,a,b,cell){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function drawField(cv,f,cell,mine,now){
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=cv.width/dpr,h=cv.height/dpr;ctx.clearRect(0,0,w,h);
  const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#2a6168');bg.addColorStop(1,'#163c40');
  ctx.fillStyle=bg;rr(ctx,0,0,w,h,Math.min(16,cell*.5));ctx.fill();
  ctx.save();rr(ctx,0,0,w,h,Math.min(16,cell*.5));ctx.clip();
  ctx.fillStyle='rgba(255,111,94,.15)';ctx.fillRect(0,0,w,(R+1)*cell);
  // faint honeycomb sockets
  ctx.fillStyle='rgba(255,255,255,.045)';
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++)if(valid(dc,y)){ctx.beginPath();ctx.arc(PX(dc,cell),PY(y,cell),cell*.12,0,7);ctx.fill()}
  // spawn marks
  ctx.strokeStyle='rgba(255,111,94,.6)';ctx.lineWidth=Math.max(1,cell*.06);
  for(const [dc,y] of pcells({...SPAWN,c:[1,1,1]})){const cx=PX(dc,cell),cy=PY(y,cell),k=cell*.14;ctx.beginPath();ctx.moveTo(cx-k,cy-k);ctx.lineTo(cx+k,cy+k);ctx.moveTo(cx+k,cy-k);ctx.lineTo(cx-k,cy+k);ctx.stroke()}
  const r=cell*.46;
  const fl=new Set((f.flash||[]).map(([dc,y])=>y*64+dc));
  // trio links
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=cell*.2;ctx.lineCap='round';
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=f.g[y][dc];if(!b||b.junk)continue;
    for(const [ax,ay] of [[2,0],[1,1],[-1,1]]){const nx=dc+ax,ny=y+ay;if(!valid(nx,ny))continue;const o=f.g[ny][nx];
      if(o&&o.pid===b.pid)link(ctx,[PX(b.vx,cell),PY(b.vy,cell)],[PX(o.vx,cell),PY(o.vy,cell)])}}
  for(let y=0;y<H;y++)for(let dc=0;dc<2*W;dc++){const b=f.g[y][dc];if(!b)continue;
    let a=1,rad=r;if(fl.has(y*64+dc)){const k=f.t/380;a=1-k*.8;rad=r*(1+k*.35)*(Math.sin(now/40)>0?1:.9)}
    ball(ctx,PX(b.vx,cell),PY(b.vy,cell),rad,b.c,a,b.junk)}
  if(f.piece&&f.state==='play'){
    if(mine){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=Math.max(1.5,cell*.06);
      for(const [dc,y] of pcells(f.dropPos())){ctx.beginPath();ctx.arc(PX(dc,cell),PY(y,cell),r*.86,0,7);ctx.stroke()}}
    // glide toward the next row at the current fall speed instead of jumping a row at a time
    const iv=f.soft?45:game.speed,off=fits(f.g,{...f.piece,y:f.piece.y+2})?2*Math.min(1,f.fallT/iv):0;
    const pts=pcells(f.piece).map(([dc,y,c])=>[PX(dc,cell),PY(y+off,cell),c]);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=cell*.2;
    for(let i=0;i<3;i++)link(ctx,pts[i],pts[(i+1)%3]);
    for(const [x,y,c] of pts)ball(ctx,x,y,r,c);
  }
  if(f.pending>0){const n=Math.min(f.pending,16);const rr2=cell*.16;
    ctx.fillStyle='rgba(20,53,56,.6)';ctx.fillRect(0,0,w,cell*.44);
    for(let i=0;i<Math.min(n,Math.floor((w-rr2)/(rr2*2.6)));i++)ball(ctx,rr2*1.4+i*rr2*2.6,cell*.22,rr2,JUNK);
  }
  for(const p of f.popups){const k=p.t/1100;ctx.globalAlpha=1-k;ctx.fillStyle='#fff';
    ctx.font=`${p.small?cell*.48:cell*.85}px "Dela Gothic One",sans-serif`;ctx.textAlign='center';
    ctx.strokeStyle='rgba(20,53,56,.85)';ctx.lineWidth=cell*.12;const y=h*(p.low?.62:p.hi?.32:.45)-k*cell;
    ctx.strokeText(p.txt,w/2,y);ctx.fillText(p.txt,w/2,y);ctx.globalAlpha=1}
  if(f.state==='dead'){ctx.fillStyle='rgba(10,30,32,.6)';ctx.fillRect(0,0,w,h)}
  ctx.restore();
}
function drawNext(){
  const ctx=nc.getContext('2d'),cell=sizes.n;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,nc.width,nc.height);
  const c=game.p.next.c,pts=[[cell,cell*.5,c[0]],[cell*1.5,cell*(.5+R),c[1]],[cell*.5,cell*(.5+R),c[2]]];
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=cell*.2;ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[(i+1)%3][0],pts[(i+1)%3][1]);ctx.stroke()}
  for(const [x,y,cc] of pts)ball(ctx,x,y,cell*.46,cc);
}
const $score=document.getElementById('score'),$maxc=document.getElementById('maxc');

let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(game.running&&!game.paused){
    game.elapsed+=dt; // fall speed stays at game.speed (900ms a row) for the whole match
    game.p.update(dt);if(game.running&&game.mode==='cpu')game.c.update(dt);
  }
  drawField(pc,game.p,sizes.p,true,now);drawField(cc,game.c,sizes.c,false,now);drawNext();
  $score.textContent=game.p.score.toLocaleString();$maxc.textContent=game.p.maxChain;
  requestAnimationFrame(frame);
}

// ---- Input ----
const act=fn=>{if(game.running&&!game.paused)fn()};
function holdBtn(id,fn,repeat){
  const b=document.getElementById(id);let t1,t2;
  const stop=()=>{b.classList.remove('on');clearTimeout(t1);clearInterval(t2);if(id==='bD')game.p.soft=false};
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');
    try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
    if(id==='bD'){game.p.soft=true;return}
    act(fn);if(repeat){t1=setTimeout(()=>{t2=setInterval(()=>act(fn),85)},260)}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
holdBtn('bL',()=>game.p.move(-1),true);
holdBtn('bR',()=>game.p.move(1),true);
holdBtn('bD',null,false);
holdBtn('bRot',()=>game.p.rotate(),false);
holdBtn('bH',()=>game.p.hardDrop(),false);

// swipe on the well: tap = rotate, drag sideways = move, flick down = drop
let sw=null;
pc.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY,lx:e.clientX,t:performance.now(),moved:false};try{pc.setPointerCapture(e.pointerId)}catch(_){}});
pc.addEventListener('pointermove',e=>{if(!sw)return;const step=sizes.p*.8;
  while(e.clientX-sw.lx>step){act(()=>game.p.move(1));sw.lx+=step;sw.moved=true}
  while(sw.lx-e.clientX>step){act(()=>game.p.move(-1));sw.lx-=step;sw.moved=true}});
pc.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,dtm=performance.now()-sw.t;
  if(dy>sizes.p*1.8&&Math.abs(dy)>Math.abs(dx))act(()=>game.p.hardDrop());
  else if(!sw.moved&&Math.abs(dx)<10&&Math.abs(dy)<10&&dtm<350)act(()=>game.p.rotate());
  sw=null});
pc.addEventListener('pointercancel',()=>sw=null);

addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft')act(()=>game.p.move(-1));
  else if(k==='ArrowRight')act(()=>game.p.move(1));
  else if(k==='ArrowUp'||k==='x'||k==='z')act(()=>game.p.rotate());
  else if(k===' '){e.preventDefault();act(()=>game.p.hardDrop())}
  else if(k==='ArrowDown')game.p.soft=true;
  else if(k==='p'||k==='Escape')togglePause();
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')game.p.soft=false});

// ---- Overlay ----
const overlay=document.getElementById('overlay'),card=document.getElementById('card');
function hideOverlay(){overlay.hidden=true}
function diffButtons(){return `<div class="choices">${Object.entries(DIFF).map(([k,d])=>`<button class="choice${k===game.diff?' main':''}" data-d="${k}">${d.name}</button>`).join('')}</div>`}
function bindChoices(){card.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>game.start(b.dataset.d)))}
function showStart(){
  card.innerHTML=`<h2>ビー玉<span>トリオ</span></h2>
  <p>三角の3つ組ビー玉を蜂の巣状に積んで、CPUと対戦する落ちものパズル。</p>
  <ul>
    <li>支えのない玉は、すき間へ<b>転がり落ちる</b></li>
    <li>同じ色を<b>6つ以上</b>つなげると消える。じゃま玉が降ってきてつながっただけでは消えず、<b>自分の玉を足してつなげたとき</b>に消える</li>
    <li>下の<b>わざ</b>(6つの決まった形。まわりに同じ色がくっついていてもOK)で消すと、<b>その色の玉がぜんぶ消え</b>、相手に<b>じゃま玉</b>(白いふち)が降る。それ以外の消し方では降らない</li>
    <li>降ってきたじゃま玉で<b>わざの形ができたとき</b>も、その場で消えて相手に送れる</li>
    <li>じゃま玉は、作ったわざと<b>同じ形の連なり</b>で、<b>2個ずつ同じ色</b>になって降る。連鎖でわざを重ねると、そのぶん増える。相殺はない</li>
    <li>じゃま玉にも色があり、<b>同じ色の玉とつながって</b>消せる(形にも使える)。隣で玉が消えたときも一緒に消える</li>
    <li>上の×印がふさがったら負け</li>
  </ul>
  <div class="shapes">${ICONS.map((s,i)=>`<figure><canvas data-i="${i}"></canvas><figcaption>${s.label}</figcaption></figure>`).join('')}</div>
  <p style="font-size:.78rem;opacity:.8">操作:ボタン、またはフィールドを<b>タップで回転</b>・<b>左右になぞって移動</b>・<b>下にはらって落とす</b></p>
  <p style="font-weight:800">CPUの強さを選んでスタート</p>${diffButtons()}
  <p style="font-weight:800">ともだちと対戦</p>${onlineMenu()}`;
  bindChoices();bindOnline();drawIcons();overlay.hidden=false;
}
const ICONS=[
  {label:'ピラミッド<br>24個',cells:SHAPES[0].cells},
  {label:'逆ピラミッド<br>24個',cells:SHAPES[1].cells},
  {label:'ストレート(ななめも)<br>19個',cells:SHAPES[3].cells},
  {label:'ヘキサゴン(真ん中は別の色)<br>36個',cells:SHAPES[5].cells,center:true},
];
function drawIcons(){
  card.querySelectorAll('.shapes canvas').forEach(cv=>{
    const ic=ICONS[cv.dataset.i],pts=ic.cells.map(([x,y])=>[x,y,3]);if(ic.center)pts.push([0,0,1]);
    const xs=pts.map(p=>p[0]/2),ys=pts.map(p=>p[1]*R),x0=Math.min(...xs),y0=Math.min(...ys);
    const bw=Math.max(...xs)-x0+1,bh=Math.max(...ys)-y0+1,W2=64,H2=52,cell=Math.min(W2/bw,H2/bh);
    cv.style.width=W2+'px';cv.style.height=H2+'px';cv.width=W2*dpr;cv.height=H2*dpr;
    const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    const ox=(W2-bw*cell)/2,oy=(H2-bh*cell)/2;
    for(const [x,y,c] of pts)ball(ctx,ox+(x/2-x0+.5)*cell,oy+(y*R-y0+.5)*cell,cell*.46,c);
  });
}
function showEnd(win,why){
  const head=`<h2>${win?'<span>かち!</span>':'まけ…'}</h2>${why==='left'?'<p>相手が部屋を出ました</p>':''}
  <p>スコア <b>${game.p.score.toLocaleString()}</b> ・ 最大 <b>${game.p.maxChain}</b> れんさ</p>`;
  if(game.mode==='online'){
    if(why==='left'){card.innerHTML=head+`<button class="choice main" id="toTitle">ホームへ</button>`;document.getElementById('toTitle').onclick=()=>goHome('')}
    else{
      card.innerHTML=head+`<p class="err" id="rmNote"></p><div class="choices two"><button class="choice main" id="againBtn">もう一回</button><button class="choice" id="quitBtn">やめる</button></div>`;
      document.getElementById('againBtn').onclick=e=>{e.target.disabled=true;e.target.textContent='相手を待っています…';net.again()};
      document.getElementById('quitBtn').onclick=()=>goHome('');
      net.tick();
    }
  }else{card.innerHTML=head+`<p style="font-weight:800">もう一回(強さを選ぶ)</p>${diffButtons()}`;bindChoices()}
  overlay.hidden=false;
}
function goHome(msg){
  net.leave();game.running=false;game.mode='cpu';game.c=cpuField;setSideLabel();showStart();
  if(msg)document.getElementById('onMsg').textContent=msg;
}
function setSideLabel(){const on=game.mode==='online',b=document.getElementById('pauseBtn');
  document.getElementById('sideLbl').textContent=on?'あいて':'CPU';b.textContent=on?'×':'II';b.setAttribute('aria-label',on?'対戦をやめる':'一時停止')}
// ---- Online menu ----
function onlineMenu(){return `<div class="online"><button class="choice" id="onBtn">オンライン</button>
  <div class="choices two" id="onMenu" hidden><button class="choice" id="hostBtn">部屋を立てる</button><button class="choice" id="joinBtn">部屋に入る</button></div>
  <p class="err" id="onMsg"></p></div>`}
function bindOnline(){
  const m=document.getElementById('onMenu'),msg=document.getElementById('onMsg');
  document.getElementById('onBtn').onclick=async()=>{
    if(!(await net.getRoom())){msg.textContent='オンライン対戦は、公開ページか claude.ai で開いたときに遊べます';return}
    m.hidden=false;msg.textContent='';
  };
  document.getElementById('hostBtn').onclick=hostRoom;
  document.getElementById('joinBtn').onclick=()=>showJoin('');
}
async function hostRoom(){
  card.innerHTML=`<h2>部屋を立てています…</h2>`;overlay.hidden=false;
  try{
    let code;
    for(let i=0;i<3;i++){ // a code someone is already hosting is re-rolled
      code=String(100000+rnd(900000));await net.open(code,'host');
      await new Promise(r=>setTimeout(r,1200));
      if(!net.others().some(p=>p.presence.role==='host'))break;
    }
    card.innerHTML=`<h2>部屋を立てました</h2><p>相手にこのコードを伝えてください</p>
      <div class="code">${code.slice(0,3)} ${code.slice(3)}</div>
      <p style="font-size:.78rem;opacity:.8">相手がこのコードを入力すると、ゲームが始まります</p>
      <button class="choice" id="cancel">やめる</button>`;
    document.getElementById('cancel').onclick=()=>{net.leave();showStart()};
    net.tick();
  }catch(e){net.leave();showStart();document.getElementById('onMsg').textContent='部屋を立てられませんでした。少し待ってもう一度どうぞ'}
}
function showJoin(err){
  card.innerHTML=`<h2>部屋に入る</h2><p>6桁のコードを入力してください</p>
    <input id="codeIn" class="codein" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="6桁のコード">
    <p class="err" id="joinMsg"></p>
    <div class="choices two"><button class="choice" id="back">もどる</button><button class="choice main" id="go">入る</button></div>`;
  overlay.hidden=false;
  const inp=document.getElementById('codeIn'),msg=document.getElementById('joinMsg');msg.textContent=err||'';
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,6)});
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')go()});
  document.getElementById('back').onclick=()=>{net.leave();showStart()};
  document.getElementById('go').onclick=go;
  async function go(){
    const code=inp.value;if(!/^\d{6}$/.test(code)){msg.textContent='6桁の数字を入れてください';return}
    msg.textContent='さがしています…';
    try{await net.open(code,'guest');net.tick()}catch(e){msg.textContent='つながりませんでした。もう一度どうぞ';return}
    setTimeout(()=>{if(net.phase==='lobby'&&net.code===code&&net.role==='guest'&&!net.others().some(p=>p.presence.role==='host')){net.leave();msg.textContent='その番号の部屋が見つかりません'}},5000);
  }
  setTimeout(()=>inp.focus(),50);
}
// online can't pause (the other player keeps going), so the button only offers to quit; the game runs on behind it
function askQuitOnline(){
  if(!game.running||!overlay.hidden)return;
  card.innerHTML=`<h2>対戦をやめますか?</h2><p>やめると負けになります。相手の対戦は止まらないので、つづけるならすぐ戻ってください。</p>
    <div class="choices two"><button class="choice main" id="resume">つづける</button><button class="choice" id="quit">やめる</button></div>`;
  overlay.hidden=false;
  document.getElementById('resume').onclick=()=>{if(game.running)hideOverlay()};
  document.getElementById('quit').onclick=()=>goHome('');
}
function togglePause(){
  if(game.mode==='online'){askQuitOnline();return}
  if(!game.running)return;game.paused=!game.paused;
  if(game.paused){card.innerHTML=`<h2>一時停止</h2><button class="choice main" id="resume">つづける</button><button class="choice" id="quit">やめてタイトルへ</button>`;
    overlay.hidden=false;
    document.getElementById('resume').onclick=togglePause;
    document.getElementById('quit').onclick=()=>{game.running=false;game.paused=false;showStart()};
  }else hideOverlay();
}
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.mode==='cpu'&&game.running&&!game.paused)togglePause()});

layout();showStart();requestAnimationFrame(frame);
})();
</script>
